name: my-First-Workflow
# To get triggered on every push in this repo in any branch
on: 
 
  push:
jobs:
  job1:
    name: My first job
    runs-on: ubuntu-latest
    steps:
      - name: step 1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step 2 - checkout
        uses: actions/checkout@v5.0.0
      - name: Step 3
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
      - name: upload artifact
        uses: actions/upload-artifact@v5.0.0
        with:
         name: single-file
         path: ./myartifact.txt
      - name: upload from directory
        uses: actions/upload-artifact@v5.0.0
        with:
         name: directory-file
         path: artifacts/
      - name: upload from multiple path
        uses: actions/upload-artifact@v5.0.0
        with:
         name: multiple-path
         path:  |
             ./myartifact.txt
             artifacts/
      - name: upload from multiple path with exclusions
        uses: actions/upload-artifact@v5.0.0
        with:
         name: multiple-path-exclusion
         path:  |
             ./myartifact.txt
             artifacts/
             !**/hostname.txt
  job2:
         name: JOB2
         runs-on: ubuntu-latest
         needs: job1
         steps:
          - name: checking current directory
            run: |
              pwd
              ls -ltr
          - name: download single artifact
            uses: actions/download-artifact@v5.0.0
            with:
                name: single-file
  job3: 
        name: JOB3
        runs-on: ubuntu-latest
        needs: job2
        steps:
          - name: checking current directory
            run: |
              pwd
              ls -ltr
          - name: download single artifact
            uses: actions/download-artifact@v5.0.0
            with:
                name: directory-file
          - name: checking current directory post download
            run: |
                pwd
                ls -ltr               
        
